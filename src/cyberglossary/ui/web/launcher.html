<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google" content="notranslate" />
<title>adudu · Search</title>
<style>
/* ── adudu tokens (shared design language) ── */
:root{
  --bg-base:#0B0F16; --bg-deep:#070A10; --surface:#0F141D; --surface-raised:#141B26;
  --surface-hover:#1A2230; --surface-active:#1E2836;
  --border-subtle:#1A222F; --border:#232E40; --border-strong:#2E3C52;
  --text-primary:#E8EEF7; --text-secondary:#9AA7B8; --text-muted:#7C8AA0;
  --accent:#4A7FFF; --accent-strong:#3B6EE8; --accent-soft:rgba(74,127,255,.14); --accent-text:#8FB0FF;
  --purple:#8B7CF6; --success:#2FBF71; --warning:#F5A524;
  --popup-fill:#0E141D;
  --font-ui:"Segoe UI",system-ui,-apple-system,"Cantarell","Noto Sans",sans-serif;
  --font-mono:"Cascadia Mono","JetBrains Mono","Consolas",ui-monospace,monospace;
  --r-xs:3px; --r-md:6px; --r-lg:8px; --r-full:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --shadow-lg:0 6px 28px rgba(0,0,0,.50);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-ui); font-size:13px; color:var(--text-primary);
  background:transparent; overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit; cursor:pointer; color:inherit}
input{font:inherit; color:inherit}
svg{display:block}
.hidden{display:none !important}
body { background:transparent; }

/* ── shell ── */
#launcher, #bar{
  position:absolute; inset:0; display:flex; flex-direction:column;
  background:var(--popup-fill); border:2px solid #305CDE;
  border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden;
}
#launcher:focus, #bar:focus, #launcher:focus-visible, #bar:focus-visible{outline:none}

/* ── header (drag) ── */
.l-head{height:40px; flex:0 0 40px; display:flex; align-items:center; gap:8px; padding:0 10px; border-bottom:1px solid var(--border-subtle); cursor:move}
.l-head .l-title{font-weight:600; color:var(--text-primary); font-size:13px}
.l-head .l-logo{color:var(--accent); display:grid; place-items:center}
.spacer{flex:1}

.icon-btn{width:26px; height:26px; flex:0 0 26px; display:grid; place-items:center; border:0; background:none; border-radius:var(--r-md); color:var(--text-muted)}
.icon-btn:hover{background:var(--surface-hover); color:var(--text-primary)}
.icon-btn svg{width:16px; height:16px}

/* ── search ── */
.l-search{display:flex; align-items:center; gap:8px; margin:10px 12px 6px; height:32px; flex:0 0 32px;
  background:var(--surface-raised); border:1px solid var(--border-subtle); border-radius:var(--r-md); padding:0 10px; color:var(--text-muted)}
.l-search:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.l-search input{flex:1; min-width:0; background:none; border:0; outline:none; color:var(--text-primary); font-size:13px}
.l-search input::placeholder{color:var(--text-muted)}

/* ── body ── */
.l-body{flex:1; overflow:auto; padding:4px 8px 8px; min-height:0}
.l-empty{padding:40px 16px; text-align:center; color:var(--text-muted)}
.l-empty h4{margin:0 0 4px; font-size:14px; color:var(--text-secondary); font-weight:600}

/* group */
.l-group{margin-bottom:6px}
.l-group-head{display:flex; align-items:center; gap:8px; height:34px; padding:0 8px; border-radius:var(--r-md); cursor:pointer; color:var(--text-secondary); user-select:none}
.l-group-head:hover{background:var(--surface-hover)}
.l-group-head .chev{color:var(--text-muted); display:grid; place-items:center; transition:transform .16s ease}
.l-group-head .g-name{flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.l-group-head .g-count{font-family:var(--font-mono); font-size:11px; color:var(--text-muted)}
.l-group-head .g-tag{font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--purple); text-transform:uppercase; letter-spacing:.06em}
.l-group .l-group-body{display:none}
.l-group.open .l-group-body{display:block}

/* term row */
.l-term{border:1px solid var(--border-subtle); background:var(--surface-raised); border-radius:var(--r-md); margin:3px 0; overflow:hidden}
.l-term-row{display:flex; align-items:center; gap:8px; height:38px; padding:0 8px; cursor:pointer}
.l-term-row:hover{background:var(--surface-hover)}
.l-term-row .chev{color:var(--text-muted); display:grid; place-items:center; transition:transform .16s ease}
.l-term-row .t-name{font-family:var(--font-mono); font-weight:600; color:var(--text-primary); white-space:nowrap}
.l-term-row .t-desc{flex:1; min-width:0; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px}
.l-term-row .t-actions{display:flex; gap:2px; opacity:0; transition:opacity .12s ease}
.l-term-row:hover .t-actions, .l-term:focus-within .t-actions{opacity:1}
.l-term-row .t-actions .icon-btn{width:24px; height:24px; flex:0 0 24px}
.l-term-row .t-actions .icon-btn svg{width:14px; height:14px}
.t-pin.on{color:var(--warning)}

/* term detail */
.l-term-body{display:none; border-top:1px solid var(--border-subtle); padding:8px}
.l-term.open .l-term-body{display:block}
.l-td-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.cat-chip{display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:var(--r-full); font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--accent-text)}
.l-td-full{color:var(--text-secondary); font-size:12px}
.l-alias{display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:var(--r-xs); background:var(--bg-deep); border:1px solid var(--border-subtle); color:var(--text-secondary); font-family:var(--font-mono); font-size:11px}

/* section card */
.l-sec{border:1px solid var(--border-subtle); border-radius:var(--r-md); background:var(--surface); margin-bottom:6px; overflow:hidden}
.l-sec-head{display:flex; align-items:center; gap:8px; height:30px; padding:0 8px; cursor:pointer; color:var(--text-secondary)}
.l-sec-head:hover{background:var(--surface-hover)}
.l-sec-head .chev{color:var(--text-muted); display:grid; place-items:center; transition:transform .16s ease}
.l-sec-head .s-title{flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.l-sec-head .icon-btn{width:24px; height:24px; flex:0 0 24px}
.l-sec-head .icon-btn svg{width:14px; height:14px}
.l-sec-body{display:none; padding:8px; border-top:1px solid var(--border-subtle); color:var(--text-secondary); font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word}
.l-sec.open .l-sec-body{display:block}
.l-empty-sec{padding:8px; color:var(--text-muted); font-size:12px}

/* ── minimized bar ── */
#bar{flex-direction:row; align-items:center; gap:10px; padding:0 10px; border-radius:var(--r-md)}
#bar .b-icon{color:var(--accent); display:grid; place-items:center}
#bar .b-text{font-family:var(--font-mono); font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#bar .b-meta{font-size:12px; color:var(--text-muted); white-space:nowrap}

/* ── resize handles ── */
.rz{position:absolute; z-index:80}
.rz-n{top:0; left:8px; right:8px; height:5px; cursor:n-resize}
.rz-s{bottom:0; left:8px; right:8px; height:5px; cursor:s-resize}
.rz-e{right:0; top:8px; bottom:8px; width:5px; cursor:e-resize}
.rz-w{left:0; top:8px; bottom:8px; width:5px; cursor:w-resize}
.rz-ne{top:0; right:0; width:12px; height:12px; cursor:ne-resize}
.rz-nw{top:0; left:0; width:12px; height:12px; cursor:nw-resize}
.rz-se{bottom:0; right:0; width:12px; height:12px; cursor:se-resize}
.rz-sw{bottom:0; left:0; width:12px; height:12px; cursor:sw-resize}
</style>
</head>
<body>
<div id="launcher" tabindex="-1">
  <div class="l-head" id="launcherDrag">
    <span class="l-title">Search</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btnMin" title="Minimize"><span data-icon="minimize"></span></button>
    <button class="icon-btn" id="btnClose" title="Close · Esc"><span data-icon="x"></span></button>
  </div>
  <div class="l-search">
    <span data-icon="search"></span>
    <input id="q" placeholder="Search terms, commands, categories…" autocomplete="off" />
  </div>
  <div class="l-body" id="lBody">
    <div class="l-results" id="lResults"></div>
  </div>
  <div class="rz rz-n" data-edge="n"></div>
  <div class="rz rz-s" data-edge="s"></div>
  <div class="rz rz-e" data-edge="e"></div>
  <div class="rz rz-w" data-edge="w"></div>
  <div class="rz rz-ne" data-edge="ne"></div>
  <div class="rz rz-nw" data-edge="nw"></div>
  <div class="rz rz-se" data-edge="se"></div>
  <div class="rz rz-sw" data-edge="sw"></div>
</div>

<div id="bar" class="hidden" tabindex="-1">
  <span class="b-icon" data-icon="search"></span>
  <span class="b-text" id="barText">Search</span>
  <span class="b-meta" id="barMeta"></span>
  <span class="spacer"></span>
  <button class="icon-btn" id="btnRestore" title="Restore"><span data-icon="restore"></span></button>
  <button class="icon-btn" id="btnClose2" title="Close"><span data-icon="x"></span></button>
  <div class="rz rz-n" data-edge="n"></div>
  <div class="rz rz-s" data-edge="s"></div>
  <div class="rz rz-e" data-edge="e"></div>
  <div class="rz rz-w" data-edge="w"></div>
  <div class="rz rz-ne" data-edge="ne"></div>
  <div class="rz rz-nw" data-edge="nw"></div>
  <div class="rz rz-se" data-edge="se"></div>
  <div class="rz rz-sw" data-edge="sw"></div>
</div>

<script src="qwebchannel.js"></script>
<script src="launcher.js"></script>
</body>
</html>
